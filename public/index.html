<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- MODA WRLD Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="%PUBLIC_URL%/assets/logoTitle.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta name="theme-color" content="#ffffff" />

    <!-- SEO -->
    <meta
      name="description"
      content="MODA WRLD – Premium streetwear. Shop the latest LH4H and Vengeance Arc.26 collections. Free delivery on orders over ₦50,000."
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="MODA WRLD - Official Store"
    />

    <meta
      property="og:description"
      content="Premium streetwear. Shop LH4H & Vengeance Arc.26."
    />

    <meta
      property="og:image"
      content="https://modawrld.com/assets/logo.jpeg"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://modawrld.com/"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="MODA WRLD - Official Store"
    />

    <meta
      name="twitter:description"
      content="Premium streetwear. Shop LH4H & Vengeance Arc.26."
    />

    <meta
      name="twitter:image"
      content="https://modawrld.com/assets/logo.jpeg"
    />

    <!-- Paystack -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <!-- Apple / iPhone Icon -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/assets/logoTitle.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <title>MODA WRLD | Swag</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
